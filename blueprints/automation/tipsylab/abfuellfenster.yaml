blueprint:
  name: TIPSYLAB · Abfüllfenster aufs Handy
  description: >-
    Meldet, wenn sich der Status eines Ansatzes ändert: Fenster in Sicht (3 Tage oder weniger),
    Fenster offen, Fenster vorbei, Gärung stockt oder Naturwein trocken.
  domain: automation
  source_url: https://github.com/studioanarc/tipsylab/blob/main/blueprints/automation/tipsylab/abfuellfenster.yaml
  input:
    status:
      name: Status des Ansatzes
      description: Der Sensor „Status“ eines TIPSYLAB-Ansatzes.
      selector:
        entity:
          filter:
            - integration: tipsylab
              domain: sensor
    handy:
      name: Handy
      description: Gerät mit der Home-Assistant-App.
      selector:
        device:
          filter:
            - integration: mobile_app
    zustaende:
      name: Melden bei
      default: [approaching, window, past, stuck, dry]
      selector:
        select:
          multiple: true
          options:
            - label: Fenster in Sicht (3 Tage oder weniger)
              value: approaching
            - label: Fenster offen
              value: window
            - label: Fenster vorbei
              value: past
            - label: Gärung stockt?
              value: stuck
            - label: Naturwein trocken
              value: dry
    sprache:
      name: Sprache · Langue · Language
      description: >-
        Für die Sätze dieser Nachricht. Namen der Sensoren und Handlungen kommen aus TIPSYLAB in der
        Sprache des Servers (Einstellungen → System → Allgemein).
      default: de
      selector:
        select:
          options:
            - label: Deutsch
              value: de
            - label: Français
              value: fr
            - label: English
              value: en

mode: queued

triggers:
  - trigger: state
    entity_id: !input status
    not_from: [unknown, unavailable]

variables:
  zustaende: !input zustaende
  sprache: !input sprache
  neu: "{{ trigger.to_state.state }}"
  ansatz: "{{ device_attr(device_id(trigger.entity_id), 'name') or trigger.to_state.name }}"
  dub: >-
    {% set ns = namespace(v='') %}
    {% for e in device_entities(device_id(trigger.entity_id)) %}
      {% if state_attr(e, 'anzeige') %}{% set ns.v = state_attr(e, 'anzeige') %}{% endif %}
    {% endfor %}
    {{ ns.v }}

conditions:
  - condition: template
    value_template: "{{ neu in zustaende and neu != trigger.from_state.state }}"

actions:
  - domain: mobile_app
    type: notify
    device_id: !input handy
    title: "{{ ansatz }}"
    message: >-
      {% set texte = {
        'de': {
          'approaching': 'Abfüllen in etwa ' ~ dub ~ '. Flaschen und Kronkorken bereitlegen, täglich messen.',
          'window': 'Das Abfüllfenster ist offen. Eine letzte Messung bestätigt es.',
          'past': 'Das Fenster ist vorbei. Jetzt abfüllen; der Druck wird niedriger als geplant.',
          'stuck': 'Gärung stockt? Der Zucker fällt kaum, ohne dass es kühler wurde. Bitte messen.',
          'dry': 'Laut Schätzung trocken. Eine Messung bestätigt es.'},
        'fr': {
          'approaching': 'Mise en bouteille dans environ ' ~ dub ~ '. Préparer bouteilles et capsules, mesurer chaque jour.',
          'window': 'La fenêtre de mise en bouteille est ouverte. Une dernière mesure la confirme.',
          'past': 'La fenêtre est passée. Mettre en bouteille maintenant ; la pression sera plus basse que prévu.',
          'stuck': 'Fermentation bloquée ? Le sucre baisse à peine sans que la température ait baissé. Merci de mesurer.',
          'dry': "Sec selon l'estimation. Une mesure le confirme."},
        'en': {
          'approaching': 'Bottling in about ' ~ dub ~ '. Get bottles and crown caps ready, measure daily.',
          'window': 'The bottling window is open. One last measurement confirms it.',
          'past': 'The window has passed. Bottle now; the pressure will be lower than planned.',
          'stuck': 'Fermentation stuck? The sugar barely falls although it did not get cooler. Please measure.',
          'dry': 'Dry according to the estimate. A measurement confirms it.'}} %}
      {{ texte[sprache][neu] if neu in texte[sprache] else 'Status: ' ~ neu }}
