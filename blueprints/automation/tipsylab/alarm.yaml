blueprint:
  name: TIPSYLAB · Alarm aufs Handy
  description: >-
    Meldet Problem-Sensoren sofort: CO₂ in der Kellerluft, Überdruck, Sensorfehler, Leck oder
    Ventil ohne Wirkung am Charmat-Tank, Flaschengrenze überschritten, Messflasche über dem
    erwarteten Druck, Quelle stumm, Akku schwach. Hat der Sensor eine Handlung, steht sie in der
    Nachricht.
  domain: automation
  source_url: https://github.com/studioanarc/tipsylab/blob/main/blueprints/automation/tipsylab/alarm.yaml
  input:
    sensoren:
      name: Alarm-Sensoren
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
    handy:
      name: Handy
      selector:
        device:
          filter:
            - integration: mobile_app
    dauer:
      name: Erst melden nach
      default: 0
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: min
    sprache:
      name: Sprache · Langue · Language
      description: >-
        Für die Sätze dieser Nachricht. Namen der Sensoren und Handlungen kommen aus TIPSYLAB in der
        Sprache des Servers (Einstellungen → System → Allgemein).
      default: de
      selector:
        select:
          options:
            - label: Deutsch
              value: de
            - label: Français
              value: fr
            - label: English
              value: en

mode: queued

variables:
  sprache: !input sprache

triggers:
  - trigger: state
    entity_id: !input sensoren
    from: "off"
    to: "on"
    for:
      minutes: !input dauer

actions:
  - domain: mobile_app
    type: notify
    device_id: !input handy
    title: "TIPSYLAB: {{ trigger.to_state.name }}"
    message: >-
      {% set zeit = as_local(trigger.to_state.last_changed).strftime('%H:%M') %}
      {% set sicherung = {
        'de': 'Das mechanische Sicherheitsventil bleibt die letzte Sicherung.',
        'fr': 'La soupape de sécurité mécanique reste la dernière protection.',
        'en': 'The mechanical safety valve remains the last safeguard.'} %}
      {% if sprache == 'fr' %}{{ trigger.to_state.name }} depuis {{ zeit }}.
      {% elif sprache == 'en' %}{{ trigger.to_state.name }} since {{ zeit }}.
      {% else %}{{ trigger.to_state.name }} seit {{ zeit }} Uhr.{% endif %}
      {{ state_attr(trigger.entity_id, 'handlung') or sicherung[sprache] }}
