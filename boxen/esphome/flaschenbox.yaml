# TIPSYLAB · Flaschenbox: Druck in der Messflasche, ein eigenes e-aphrom (PLAN Phase 5).
#
# Hardware: M5 AtomS3R (oder AtomS3, siehe packages), ADS1115 am Grove-Port (I²C), Drucktransmitter
# 0–10 bar (0,5–4,5 V, Edelstahl) auf einem Kronkorken-Adapter (Kronkorken mit Durchführung und
# G1/4-Gewinde, wie bei Aphrometern), DS18B20 außen an der Flasche, mit Wärmeleitpaste und Klebeband.
# Die Messflasche steht bei den anderen Flaschen und wird genauso behandelt.
#
# Die Integration nimmt Druck und Temperatur als Messflasche (Quellen „Messflasche: Druck“ und
# „Messflasche: Temperatur“), rechnet auf 20 °C um und vergleicht mit dem erwarteten Druck. Der
# Alarm kommt aus der Integration; die Box misst, zeigt an und meldet.
#
# Sicherheit: Transmitter, Adapter und Kronkorken müssen den Grenzdruck der Flasche aushalten
# (750 ml: 6 bar, 330 ml: 4,5 bar). Den Adapter nur mit Schutzbrille aufsetzen und abnehmen.
#
# Verdrahtung wie die Tankbox, ohne Ventil (Pins prüfen, bevor Strom drauf kommt):
#   Grove  G2 = SDA, G1 = SCL, 5 V, GND  -> ADS1115 mit 3,3 V versorgen (Pull-ups auf 3,3 V!)
#   Drucktransmitter 0,5–4,5 V an 5 V    -> Spannungsteiler 10 kΩ / 20 kΩ -> ADS1115 A0 (max. 3,0 V)
#   G6 -> DS18B20 Daten (4,7 kΩ nach 3,3 V)
#   Display (eingebaut): BAR = Druck jetzt, darunter die Temperatur der Flasche
#
# Einrichten: secrets.yaml.example nach secrets.yaml kopieren, dann
#   esphome run flaschenbox.yaml

substitutions:
  name: tipsy-flasche-01
  friendly_name: Messflasche 01
  # Drucktransmitter: Spannung bei 0 bar und bei Vollausschlag, Messbereich
  sensor_v_min: "0.5"
  sensor_v_max: "4.5"
  sensor_p_max: "10.0"     # bar Überdruck bei sensor_v_max
  divider: "1.5"           # Teiler 10 kΩ / 20 kΩ: Sensorspannung = ADC-Spannung × 1,5

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: TIPSYLAB Messflasche
  project:
    name: studioanarc.tipsylab-flasche
    version: "0.1.0"

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {}                   # Uploads mit dem API-Schlüssel, kein eigenes Passwort

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}
    password: !secret ap_password

captive_portal:

packages:
  # Hardware: AtomS3R ab Mai 2026 (Standard). Frühe AtomS3R mit GC9107-Display:
  # pakete/board-atoms3r-gc9107.yaml, die alte AtomS3: pakete/board-atoms3.yaml.
  board: !include pakete/board-atoms3r.yaml

i2c:
  - id: grove
    sda: GPIO2
    scl: GPIO1
    frequency: 400kHz

ads1115:
  - address: 0x48
    i2c_id: grove

one_wire:
  - platform: gpio
    pin: GPIO6

color:
  - id: tinte
    hex: 2b2c78
  - id: papier
    hex: f9e3e7
  - id: gedimmt
    hex: 8e8fc4

font:
  - file: "gfonts://JetBrains Mono@700"
    id: gross
    size: 30
    glyphs: "0123456789,-°"
    bpp: 4
  - file: "gfonts://JetBrains Mono@700"
    id: klein
    size: 13
    glyphs: " 0123456789,-°ABFLR"
    bpp: 4

# Eingebautes Display; Treiber und Pins kommen aus dem Board-Paket (id: anzeige).
display:
  - id: !extend anzeige
    update_interval: 2s
    lambda: |-
      auto komma = [](char *s) { for (; *s; s++) if (*s == '.') *s = ','; };
      char buf[16];
      it.fill(id(tinte));
      const float p = id(p_flasche).state;
      if (isnan(p)) snprintf(buf, sizeof(buf), "--"); else { snprintf(buf, sizeof(buf), "%.2f", p); komma(buf); }
      it.print(5, 50, id(gross), id(papier), TextAlign::BASELINE_LEFT, buf);
      it.print(124, 50, id(klein), id(gedimmt), TextAlign::BASELINE_RIGHT, "BAR");
      const float t = id(t_flasche).state;
      if (isnan(t)) snprintf(buf, sizeof(buf), "--°"); else { snprintf(buf, sizeof(buf), "%.1f°", t); komma(buf); }
      it.print(5, 110, id(gross), id(papier), TextAlign::BASELINE_LEFT, buf);
      it.print(124, 110, id(klein), id(gedimmt), TextAlign::BASELINE_RIGHT, "FLA");

sensor:
  - platform: ads1115
    multiplexer: A0_GND
    gain: 4.096
    id: sensor_spannung
    name: Drucksensor Spannung
    entity_category: diagnostic
    unit_of_measurement: V
    accuracy_decimals: 3
    update_interval: 5s
    filters:
      - multiply: ${divider}
      - sliding_window_moving_average:
          window_size: 6
          send_every: 2
  - platform: template
    name: Flaschendruck
    id: p_flasche
    unit_of_measurement: bar
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      const float v = id(sensor_spannung).state;
      if (isnan(v) || v < ${sensor_v_min} - 0.2f || v > ${sensor_v_max} + 0.2f) return NAN;  // Kabelbruch, Kurzschluss
      return (v - ${sensor_v_min}) / (${sensor_v_max} - ${sensor_v_min}) * ${sensor_p_max};
  - platform: dallas_temp
    id: t_flasche
    name: Flaschentemperatur
    update_interval: 60s
  - platform: wifi_signal
    name: WLAN-Signal
    entity_category: diagnostic
    update_interval: 120s

binary_sensor:
  - platform: template
    name: Sensorfehler
    device_class: problem
    lambda: return isnan(id(p_flasche).state);
    filters:
      - delayed_on: 2min

button:
  - platform: restart
    name: Neustart
    entity_category: config
