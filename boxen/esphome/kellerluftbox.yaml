# TIPSYLAB · Kellerluftbox: CO₂, Temperatur, Feuchte und Luftdruck im Keller (PLAN 3.10 und 3.13).
#
# Gär-CO₂ ist schwerer als Luft und sammelt sich am Boden. Der Arbeitsplatzgrenzwert liegt bei
# 5.000 ppm (0,5 %). Das Gerät deshalb tief montieren, etwa 30 cm über dem Boden, nicht direkt
# neben einem Gärröhrchen.
#
# Hardware: M5 AtomS3, Grove-Hub, Sensirion SCD41 (CO₂, NDIR), M5 ENV IV (SHT40 + BMP280).
#   Grove  G2 = SDA, G1 = SCL
#
# Die automatische Selbstkalibrierung des SCD41 ist aus: Sie setzt voraus, dass der Sensor jede
# Woche Frischluft (~420 ppm) sieht, was im Gärkeller nicht stimmt. Stattdessen alle paar Monate
# das Gerät 5 Minuten ins Freie legen und "CO₂ an Frischluft kalibrieren" drücken.
#
# Einrichten: secrets.yaml.example nach secrets.yaml kopieren, dann
#   esphome run kellerluftbox.yaml
# Eine Waage lässt sich anhängen: siehe pakete/waage.yaml (G5 und G6 sind frei).

substitutions:
  name: tipsy-kellerluft
  friendly_name: Kellerluft
  co2_warnung: "1500"      # ppm: lüften
  co2_alarm: "5000"        # ppm: Arbeitsplatzgrenzwert, Keller nicht ohne Lüftung betreten

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: TIPSYLAB Kellerluft
  project:
    name: studioanarc.tipsylab-kellerluft
    version: "0.1.0"

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {}                   # Uploads mit dem API-Schlüssel, kein eigenes Passwort

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}
    password: !secret ap_password

captive_portal:

i2c:
  sda: GPIO2
  scl: GPIO1
  frequency: 100kHz

sensor:
  - platform: bmp280_i2c
    address: 0x76
    temperature:
      id: bmp_temperatur
      internal: true
    pressure:
      id: luftdruck
      name: Luftdruck
      accuracy_decimals: 1
    update_interval: 60s
  - platform: sht4x
    temperature:
      id: temperatur
      name: Temperatur
      accuracy_decimals: 1
    humidity:
      id: feuchte
      name: Luftfeuchte
      accuracy_decimals: 0
    update_interval: 60s
  - platform: scd4x
    id: scd41
    co2:
      id: co2
      name: CO₂
      accuracy_decimals: 0
    automatic_self_calibration: false
    measurement_mode: periodic
    ambient_pressure_compensation_source: luftdruck
    update_interval: 30s

binary_sensor:
  - platform: template
    name: CO₂ lüften
    id: co2_lueften
    device_class: problem
    lambda: return !isnan(id(co2).state) && id(co2).state > ${co2_warnung};
    filters:
      - delayed_on: 2min
      - delayed_off: 5min
  - platform: template
    name: CO₂ Alarm
    id: co2_gefahr
    device_class: safety
    lambda: return !isnan(id(co2).state) && id(co2).state > ${co2_alarm};
    filters:
      - delayed_on: 30s
      - delayed_off: 5min

button:
  - platform: template
    name: CO₂ an Frischluft kalibrieren
    icon: mdi:weather-windy
    entity_category: config
    on_press:
      - scd4x.perform_forced_calibration:
          value: 420
          id: scd41
  - platform: restart
    name: Neustart
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: ESPHome-Version
    hide_timestamp: true
