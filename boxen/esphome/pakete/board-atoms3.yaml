# TIPSYLAB · Board-Paket: M5Stack AtomS3 (Vorgänger, bei M5Stack EOL), Display GC9107.
#
# Für Geräte, die schon da sind. Neu kaufen: AtomS3R (board-atoms3r.yaml).
# Am Gerät nicht geprüft: Ist das Bild verschoben, offset_height auf 0 setzen; sind die Farben
# vertauscht, invert_colors umschalten.

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf

spi:
  clk_pin: GPIO17
  mosi_pin: GPIO21

output:
  - platform: ledc
    pin: GPIO16
    id: display_licht

light:
  - platform: monochromatic
    output: display_licht
    name: Display
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON

display:
  - platform: mipi_spi
    id: anzeige
    model: GC9107
    cs_pin: GPIO15
    dc_pin: GPIO33
    reset_pin: GPIO34
    dimensions:
      width: 128
      height: 128
      offset_height: 32
    invert_colors: false
