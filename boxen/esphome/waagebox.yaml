# TIPSYLAB · Waagebox: Gewicht eines Gefäßes, eigenständig (ESPHome).
#
# Wofür: Ballon auf einer Plattformwaage, oder Tank mit drei Beinen und einer Wägezelle unter
# einem Bein. Hat das Gefäß schon eine Gärbox, kann der HX711 auch dort hängen (Gärbox-Firmware);
# die Waagebox ist für Gefäße ohne Gärbox oder wenn das Kabel vom Bein zum Gärröhrchen stört.
#
# Hardware: M5 AtomS3, HX711-Board, Wägezelle (Plattform: Single-Point; Tankbein: Druck-Wägezelle
# oder Wägemodul, ~500 kg). Anschluss:
#   HX711 VCC -> 3V3, GND -> GND, DT (DOUT) -> G5, SCK -> G6
#   Wägezelle: E+ rot, E− schwarz, A− weiß, A+ grün (Farben je nach Hersteller prüfen)
#
# Einrichten: secrets.yaml.example nach secrets.yaml kopieren, dann
#   esphome run waagebox.yaml
# Eichen: siehe pakete/waage.yaml.

substitutions:
  name: tipsy-waage-01
  friendly_name: Waage 01

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: TIPSYLAB Waagebox
  project:
    name: studioanarc.tipsylab-waagebox
    version: "0.1.0"

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {}                   # Uploads mit dem API-Schlüssel, kein eigenes Passwort

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}
    password: !secret ap_password

captive_portal:

packages:
  waage: !include
    file: pakete/waage.yaml
    vars:
      dout_pin: GPIO5
      sck_pin: GPIO6

# Optional: Temperatur an der Wägezelle, um Drift zu erkennen (DS18B20 an G2, 4,7 kΩ nach 3,3 V)
# one_wire:
#   - platform: gpio
#     pin: GPIO2
# sensor:
#   - platform: dallas_temp
#     name: Temperatur Wägezelle
#     update_interval: 60s

spi:
  clk_pin: GPIO17
  mosi_pin: GPIO21

output:
  - platform: ledc
    pin: GPIO16
    id: display_licht

light:
  - platform: monochromatic
    output: display_licht
    name: Display
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON

color:
  - id: tinte
    hex: 2b2c78
  - id: papier
    hex: f9e3e7
  - id: gedimmt
    hex: 8e8fc4

font:
  - file: "gfonts://JetBrains Mono@700"
    id: gross
    size: 30
    glyphs: "0123456789,-"
    bpp: 4
  - file: "gfonts://JetBrains Mono@700"
    id: klein
    size: 13
    glyphs: " 0123456789,-ACEGHIKNRT"
    bpp: 4

# Eingebautes Display des AtomS3 (GC9107). Am Gerät nicht geprüft: Ist das Bild verschoben,
# offset_height auf 0 setzen; sind die Farben vertauscht, invert_colors umschalten.
display:
  - platform: mipi_spi
    model: GC9107
    cs_pin: GPIO15
    dc_pin: GPIO33
    reset_pin: GPIO34
    dimensions:
      width: 128
      height: 128
      offset_height: 32
    invert_colors: false
    update_interval: 2s
    lambda: |-
      char buf[16];
      it.fill(id(tinte));
      const float kg = id(waage_gewicht).state;
      if (id(waage_faktor) == 0.0f) {
        it.print(64, 70, id(klein), id(papier), TextAlign::CENTER, "EICHEN");
      } else {
        if (isnan(kg)) snprintf(buf, sizeof(buf), "--");
        else if (fabsf(kg) < 100.0f) snprintf(buf, sizeof(buf), "%.2f", kg);
        else snprintf(buf, sizeof(buf), "%.1f", kg);
        for (char *s = buf; *s; s++) if (*s == '.') *s = ',';
        it.print(64, 70, id(gross), id(papier), TextAlign::BASELINE_CENTER, buf);
        it.print(64, 92, id(klein), id(gedimmt), TextAlign::BASELINE_CENTER, "KG");
      }

text_sensor:
  - platform: version
    name: ESPHome-Version
    hide_timestamp: true
