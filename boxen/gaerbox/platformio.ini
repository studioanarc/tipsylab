; TIPSYlab – M5 AtomS3 fermentation bubble counter
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-atoms3
; Optional, git-ignored. Copy secrets.ini.example -> secrets.ini to bake WiFi/MQTT
; defaults and the OTA password into the firmware (no setup portal needed).
extra_configs = secrets.ini

[secrets]
; Fallbacks used when secrets.ini is absent (device then starts its setup portal).
build_flags =
ota_host = tipsy.local
ota_password =

[env]
platform = espressif32
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = spiffs
; Partition table = board default (default_8MB.csv): two 3.3 MB OTA app slots + 1.5 MB SPIFFS.
; Do NOT set huge_app.csv here – it has a single app slot and breaks OTA.
lib_deps =
    m5stack/M5Unified @ ^0.2.22
    ; AtomS3R ab Mai 2026 mit ST7735-Display: erst M5GFX 0.2.32 erkennt es
    m5stack/M5GFX @ ^0.2.32
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.3.0
    esphome/ESPAsyncWebServer-esphome @ ^3.4.0
    esphome/AsyncTCP-esphome @ ^2.1.4
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^4.0.5
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Keep the web server task off the Arduino loop's core (1): a dashboard request otherwise
    ; pre-empts the gyro loop for 30-160 ms and drops samples.
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    ; Route Serial to the USB port (the board profile only sets ARDUINO_USB_MODE=1,
    ; without this Serial goes to UART0 which is not wired out on the AtomS3)
    -DARDUINO_USB_CDC_ON_BOOT=1
    ${secrets.build_flags}

; --- USB (first flash / recovery) ---------------------------------------------
;   pio run -t upload            (firmware)
;   pio run -t uploadfs          (web UI files from data/)
[env:m5stack-atoms3]

; --- Over the air ---------------------------------------------------------------
;   pio run -e m5stack-atoms3-ota -t upload   --upload-port tipsy-xxxxxx.local
;   pio run -e m5stack-atoms3-ota -t uploadfs --upload-port tipsy-xxxxxx.local
; The device name is shown on the AtomS3 screen and in the dashboard.
[env:m5stack-atoms3-ota]
upload_protocol = espota
upload_port = ${secrets.ota_host}
upload_flags = --auth=${secrets.ota_password}

; --- Over HTTP (push) -------------------------------------------------------------
; Works through NAT (e.g. a ChromeOS/WSL dev VM) because the PC pushes to the device:
;   pio run -e m5stack-atoms3-http -t upload   --upload-port <box-ip>
;   pio run -e m5stack-atoms3-http -t uploadfs --upload-port <box-ip>
[env:m5stack-atoms3-http]
upload_protocol = custom
upload_port = ${secrets.ota_host}
upload_command = curl -sS -f -u admin:${secrets.ota_password} -F "image=@$SOURCE" "http://$UPLOAD_PORT/update"
