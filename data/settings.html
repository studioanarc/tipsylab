<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratoire Tresor - Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Laboratoire Tresor</h1>
            <div class="nav-links">
                <a href="/">Dashboard</a>
                <a href="/config" class="active">Settings</a>
            </div>
        </header>
        
        <form id="config-form">
            <div class="form-section">
                <h3>WiFi Configuration</h3>
                <div class="form-group">
                    <label for="wifi_ssid">WiFi SSID:</label>
                    <input type="text" id="wifi_ssid" name="wifi_ssid" required>
                </div>
                <div class="form-group">
                    <label for="wifi_password">WiFi Password:</label>
                    <input type="password" id="wifi_password" name="wifi_password" placeholder="Leave blank to keep current password">
                </div>
            </div>

            <div class="form-section">
                <h3>MQTT Configuration</h3>
                <div class="form-group">
                    <label for="mqtt_server">MQTT Server:</label>
                    <input type="text" id="mqtt_server" name="mqtt_server" required>
                </div>
                <div class="form-group">
                    <label for="mqtt_port">MQTT Port:</label>
                    <input type="number" id="mqtt_port" name="mqtt_port" value="1883">
                </div>
                <div class="form-group">
                    <label for="mqtt_user">MQTT Username:</label>
                    <input type="text" id="mqtt_user" name="mqtt_user">
                </div>
                <div class="form-group">
                    <label for="mqtt_password">MQTT Password:</label>
                    <input type="password" id="mqtt_password" name="mqtt_password" placeholder="Leave blank to keep current password">
                </div>
                <div class="form-group">
                    <label for="mqtt_client_id">MQTT Client ID:</label>
                    <input type="text" id="mqtt_client_id" name="mqtt_client_id" value="M5AtomS3Vibration">
                </div>
            </div>

            <div class="form-section">
                <h3>Device Configuration</h3>
                <div class="form-group">
                    <label for="hostname">Hostname:</label>
                    <input type="text" id="hostname" name="hostname" value="tresor.lab">
                </div>
            </div>

            <div class="form-section">
                <h3>Sensor Configuration</h3>
                <div class="form-group">
                    <label for="gyro_threshold">Gyro Threshold:</label>
                    <input type="range" id="gyro_threshold" min="0.1" max="5.0" step="0.1" value="0.5">
                    <span id="gyro_threshold_value">0.5</span>
                </div>
                
                <div class="form-group">
                    <label for="min_activity_threshold">Min Activity Threshold:</label>
                    <input type="range" id="min_activity_threshold" min="0.05" max="1.0" step="0.05" value="0.2">
                    <span id="min_activity_threshold_value">0.2</span>
                </div>
                
                <div class="form-group">
                    <label for="debounce_time">Debounce Time (ms):</label>
                    <input type="range" id="debounce_time" min="200" max="5000" step="100" value="1000">
                    <span id="debounce_time_value">1000</span>
                </div>
            </div>

            <button type="submit" class="btn-primary">Save Settings</button>
            <button type="button" id="restart-btn" class="btn-warning">Restart Device</button>
        </form>

        <div id="status-message" class="hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
