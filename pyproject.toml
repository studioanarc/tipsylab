[project]
name = "tipsylab"
version = "0.1.0"
description = "Abfüllfenster für Pet Nat, Charmat-Druckregelung und Gärüberwachung für Naturwein (Home Assistant)"
requires-python = ">=3.13.2"

[dependency-groups]
# Testumgebung: Home Assistant 2026.2 samt pytest-Plugin (uv sync)
dev = ["pytest-homeassistant-custom-component==0.13.316"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "PIE", "RUF", "BLE"]
# Gedankenstrich, Minuszeichen und σ stehen mit Absicht in Texten und Kommentaren
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# wie Home Assistant: innerhalb eines Blocks nach Modul sortiert, HA als eigener Block
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["homeassistant", "core", "simulator", "druckmodell"]
