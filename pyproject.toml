[project]
name = "tipsylab"
version = "0.1.0"
description = "Abfüllfenster für Pet Nat, Charmat-Druckregelung und Gärüberwachung für Naturwein (Home Assistant)"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"
