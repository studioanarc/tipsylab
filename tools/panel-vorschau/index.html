<!doctype html>
<!-- Panel-Vorschau ohne Home Assistant: echtes Panel, nachgebautes hass-Objekt, echte Daten der
     Integration (batches.json, previews.json; erzeugt von tests/integration/test_panel_dump.py).

     PANEL_DUMP=tools/panel-vorschau uv run pytest tests/integration/test_panel_dump.py
     python3 -m http.server 8765 --bind 127.0.0.1        (im Repo-Ordner)
     http://127.0.0.1:8765/tools/panel-vorschau/?tab=today&narrow=1&w=390

     Parameter: tab=today|measure|target|tank, b=0|1|2|3 (Ansatz), archive=1 (Archiv öffnen), w=Breite in px, dark=1,
     type=<Messwert> (tippt in „Messung“), kind=<Messart> (z. B. sugar für Labor), type2=<zweiter Wert> (Dichte in °Oe oder Alkohol in % vol), slide=<°C> (Keller-Regler). -->
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIPSYLAB Vorschau</title>
<style>html,body{margin:0;background:#888}</style></head>
<body>
<script type="module">
const STATIC = "/custom_components/tipsylab/frontend";
const q = new URLSearchParams(location.search);
const data = await (await fetch("./batches.json")).json();
const previews = await (await fetch("./previews.json")).json();
try {
  localStorage.setItem("tipsylab.tab", q.get("tab") || "today");
  localStorage.setItem("tipsylab.batch", data.batches[Number(q.get("b") || 0)].entry_id);
} catch {}
const hass = {
  themes: { darkMode: q.get("dark") === "1" },
  callWS: async (msg) => {
    if (msg.type === "tipsylab/batches") return data;
    if (msg.type === "tipsylab/preview") return previews[msg.entry_id]?.result || { prev_sugar: null };
    throw { code: "unknown_command", message: "unbekannt" };
  },
  callService: async (domain, service, payload) => console.log("Service", domain, service, payload),
};
await import(`${STATIC}/tipsylab-panel.js?v=dev`);
const el = document.createElement("tipsylab-panel");
el.panel = { config: { static: STATIC } };
el.narrow = q.get("narrow") === "1";
el.hass = hass;
const box = document.createElement("div");
if (q.get("w")) box.style.width = `${q.get("w")}px`;
box.appendChild(el);
document.body.appendChild(box);
const later = (ms) => new Promise((r) => setTimeout(r, ms));
if (q.get("archive")) {
  await later(400);
  el.shadowRoot.querySelector("[data-act=archive]")?.click();
}
if (q.get("kind")) {
  await later(400);
  el.shadowRoot.querySelector(`[data-act=mkind][data-kind="${q.get("kind")}"]`)?.click();
}
if (q.get("type")) {
  await later(400);
  const input = el.shadowRoot.getElementById("m-value");
  input.value = q.get("type");
  input.dispatchEvent(new Event("input", { bubbles: true, composed: true }));
  if (q.get("type2")) {
    const input2 = el.shadowRoot.getElementById("m-value2");
    input2.value = q.get("type2");
    input2.dispatchEvent(new Event("input", { bubbles: true, composed: true }));
  }
}
if (q.get("slide")) {
  await later(400);
  const s = el.shadowRoot.getElementById("d-whatif");
  s.value = q.get("slide");
  s.dispatchEvent(new Event("input", { bubbles: true, composed: true }));
}
</script>
</body></html>
